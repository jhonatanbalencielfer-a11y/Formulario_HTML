<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário Simples</title>
</head>
<body>
  <h1>Cadastro</h1>

  <form action="#" method="get">
    Nome: <input type="text" name="nome" required><br><br>
    E-mail: <input type="email" name="email" required><br><br>
    Idade: <input type="number" name="idade" required><br><br>

    Gênero:
    <input type="radio" name="genero" value="Masculino" required>Masculino
    <input type="radio" name="genero" value="Feminino">Feminino
    <input type="radio" name="genero" value="Outro">Outro<br><br>

    <input type="checkbox" name="termos" required>Aceito os termos<br><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
